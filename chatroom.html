<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chicken Chatroom</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#101010;--panel2:#151515;--line:#282828;--fg:#f6f6f6;--muted:#9b9b9b;--shadow:0 20px 60px rgba(0,0,0,.45)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(1200px 600px at 50% -20%,#1b1b1b 0,#0b0b0b 55%,#070707 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--fg)}
button,input{font:inherit}button{cursor:pointer}.wrap{height:100%;display:flex;flex-direction:column;padding:18px}.shell{max-width:1100px;width:100%;margin:auto;display:flex;flex-direction:column;min-height:0;height:100%;background:rgba(16,16,16,.88);border:1px solid #202020;border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.top{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.brand{font-weight:800;letter-spacing:-.03em;font-size:18px}.spacer{flex:1}.mode{display:flex;background:#0b0b0b;border:1px solid var(--line);padding:3px;border-radius:13px}.mode button{border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:10px;font-weight:700}.mode button.active{background:#f4f4f4;color:#0a0a0a}.iconbtn{border:1px solid var(--line);background:#0e0e0e;color:#fff;width:38px;height:38px;border-radius:12px}.main{display:flex;flex:1;min-height:0}.left{width:260px;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#7b7b7b;margin:3px 5px}.field{display:flex;gap:8px}.input{flex:1;min-width:0;background:#0b0b0b;border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:11px 12px;outline:none}.input:focus{border-color:#555}.primary{background:#f5f5f5;color:#090909;border:0;border-radius:12px;padding:11px 13px;font-weight:800}.secondary{background:#0b0b0b;color:#f5f5f5;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700}.room{padding:12px 13px;border:1px solid var(--line);background:#0b0b0b;border-radius:14px;color:var(--fg)}.room small{display:block;color:#777;margin-top:4px}.chat{flex:1;min-width:0;display:flex;flex-direction:column}.messages{flex:1;min-height:0;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:10px}.msg{max-width:78%;background:#111;border:1px solid #232323;border-radius:17px;padding:11px 13px;align-self:flex-start}.msg.mine{align-self:flex-end;background:#f4f4f4;color:#0a0a0a;border-color:#f4f4f4}.who{font-size:11px;font-weight:800;margin-bottom:4px;opacity:.62}.body{white-space:pre-wrap;word-break:break-word}.time{font-size:10px;opacity:.45;margin-top:6px}.composer{padding:15px;border-top:1px solid var(--line);display:flex;gap:10px}.composer .input{padding:13px}.status{font-size:12px;color:#777;margin-top:auto;padding:10px 5px}.notice{padding:12px 14px;border:1px solid var(--line);border-radius:14px;color:#aaa;font-size:12px;line-height:1.45}.hidden{display:none!important}@media(max-width:760px){.left{width:210px}.messages{padding:16px}.top{padding:14px}.wrap{padding:8px}}
</style>
</head>
<body>
<div class="wrap"><div class="shell">
  <div class="top"><div class="brand">Chicken Chatroom</div><div class="spacer"></div><div class="mode"><button id="globalBtn" class="active">Global</button><button id="lanBtn">LAN</button></div><button class="iconbtn" id="clearBtn" title="Clear only your local view">⌫</button></div>
  <div class="main">
    <aside class="left">
      <div class="label">Display name</div>
      <div class="field"><input id="nameInput" class="input" maxlength="32"><button id="saveName" class="primary">Save</button></div>
      <div class="label">LAN room</div>
      <button id="createRoom" class="secondary">Create room</button>
      <div class="field"><input id="roomInput" class="input" maxlength="12" placeholder="Room code"><button id="joinRoom" class="secondary">Join</button></div>
      <div class="room" id="roomState">Global room<small>Messages are shared globally.</small></div>
      <div class="notice">Global uses the Firestore collection <b>chickenGlobalMessages</b>. LAN uses <b>chickenRooms/&lt;room&gt;/messages</b>. Your “clear” button only hides older messages on this device.</div>
      <div class="status" id="status">Connecting…</div>
    </aside>
    <section class="chat"><div class="messages" id="messages"></div><form class="composer" id="form"><input id="textInput" class="input" autocomplete="off" placeholder="Write a message…"><button class="primary">Send</button></form></section>
  </div>
</div></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyAF7B7qYDrUi-C5_6LCjQfoXRhH95QmIio',authDomain:'v14a-bb967.firebaseapp.com',projectId:'v14a-bb967',storageBucket:'v14a-bb967.firebasestorage.app',messagingSenderId:'226123648400',appId:'1:226123648400:web:089323e070661a87c4b715',measurementId:'G-R9Q24182LC'};
const db=getFirestore(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id); const key='chicken-chat-settings-v1';
const saved=JSON.parse(localStorage.getItem(key)||'{}');
let displayName=saved.name||`Chicken_${Math.floor(1000+Math.random()*9000)}`; let mode='global'; let roomId=saved.room||''; let unsubscribe=null;
$('nameInput').value=displayName;
const clearKey=()=>`chicken-clear-${mode}-${mode==='lan'?roomId||'none':'global'}`;
function save(){localStorage.setItem(key,JSON.stringify({name:displayName,room:roomId}));}
function setStatus(t){$('status').textContent=t;}
function target(){return mode==='global'?collection(db,'chickenGlobalMessages'):collection(db,'chickenRooms',roomId,'messages');}
function start(){ if(unsubscribe) unsubscribe(); $('messages').innerHTML=''; if(mode==='lan'&&!roomId){$('roomState').innerHTML='No LAN room<small>Create or join one to chat privately.</small>';setStatus('Choose a LAN room.');return;} $('roomState').innerHTML=mode==='global'?'Global room<small>Messages are shared globally.</small>':`LAN • ${roomId}<small>Private room code.</small>`; const q=query(target(),orderBy('createdAt','desc'),limit(100)); unsubscribe=onSnapshot(q,snap=>{const cutoff=Number(localStorage.getItem(clearKey())||0); const docs=[...snap.docs].reverse(); $('messages').innerHTML=''; for(const d of docs){const m=d.data();const ms=m.createdAt?.toMillis?.()||m.clientTs||0;if(ms<cutoff)continue; render({id:d.id,...m,ms});} $('messages').scrollTop=$('messages').scrollHeight;setStatus('Connected');},err=>{console.error(err);setStatus('Firestore error — check your Firestore rules.');}); }
function render(m){const el=document.createElement('div');el.className='msg'+(m.name===displayName?' mine':'');const when=m.ms?new Date(m.ms).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'';el.innerHTML=`<div class="who"></div><div class="body"></div><div class="time"></div>`;el.querySelector('.who').textContent=m.name||'Chicken';el.querySelector('.body').textContent=m.text||'';el.querySelector('.time').textContent=when;$('messages').appendChild(el);}
$('saveName').onclick=()=>{displayName=$('nameInput').value.trim()||displayName;save();};
$('globalBtn').onclick=()=>{mode='global';$('globalBtn').classList.add('active');$('lanBtn').classList.remove('active');start();};
$('lanBtn').onclick=()=>{mode='lan';$('lanBtn').classList.add('active');$('globalBtn').classList.remove('active');start();};
$('createRoom').onclick=()=>{roomId=Math.random().toString(36).slice(2,8).toUpperCase();save();$('roomInput').value=roomId;mode='lan';$('lanBtn').classList.add('active');$('globalBtn').classList.remove('active');start();};
$('joinRoom').onclick=()=>{const v=$('roomInput').value.trim().toUpperCase();if(!v)return;roomId=v;save();mode='lan';$('lanBtn').classList.add('active');$('globalBtn').classList.remove('active');start();};
$('clearBtn').onclick=()=>{localStorage.setItem(clearKey(),String(Date.now()));start();};
$('form').onsubmit=async e=>{e.preventDefault();const text=$('textInput').value.trim();if(!text||(mode==='lan'&&!roomId))return;try{await addDoc(target(),{name:displayName,text,clientTs:Date.now(),createdAt:serverTimestamp()});$('textInput').value='';}catch(err){console.error(err);setStatus('Could not send — check Firestore rules.');}};
start();
</script>
</body></html>
